name: Agent delivery dispatch

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: Maximum issues to dispatch this run
        required: true
        default: "1"
        type: string
      issue_number:
        description: Optional single issue number (overrides queue scan)
        required: false
        type: string
  # Uncomment after secrets and labels are configured:
  # schedule:
  #   - cron: "0 18 * * 1-5"  # UTC 18:00 ≈ CST 02:00 next day

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-delivery-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify secrets
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::error::Missing secret CURSOR_API_KEY. See .delivery/README.md"
            exit 1
          fi

      - name: Resolve issue queue
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          SINGLE: ${{ inputs.issue_number }}
          MAX: ${{ inputs.max_tasks }}
        run: |
          set -euo pipefail
          if [ -n "$SINGLE" ]; then
            [[ "$SINGLE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::issue_number must be a positive integer"; exit 1; }
            issue="$(gh issue view "$SINGLE" --json state,labels)"
            jq -e '.state == "OPEN" and ([.labels[].name] | index("agent-safe") != null and index("agent-running") == null and index("agent-blocked") == null and index("agent-done") == null and index("human-only") == null and index("agent-assisted") == null)' <<< "$issue" >/dev/null
            echo "numbers=$SINGLE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAX="${MAX:-1}"
          [[ "$MAX" =~ ^[1-9][0-9]*$ ]] || { echo "::error::max_tasks must be a positive integer"; exit 1; }
          queue="$(gh issue list \
            --label "agent-safe" \
            --state open \
            --search '-label:agent-running -label:agent-blocked -label:agent-done -label:human-only -label:agent-assisted' \
            --limit "$MAX" --json number)"
          joined="$(jq -r 'map(.number | tostring) | join(",")' <<< "$queue")"
          echo "numbers=$joined" >> "$GITHUB_OUTPUT"
          [ -n "$joined" ] || echo "No eligible issues in queue."

      - name: Dispatch Cloud Agents
        if: steps.queue.outputs.numbers != ''
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBERS: ${{ steps.queue.outputs.numbers }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          IFS=',' read -ra ISSUES <<< "$ISSUE_NUMBERS"
          failed=0
          for n in "${ISSUES[@]}"; do
            n="$(echo "$n" | xargs)"
            [ -z "$n" ] && continue
            echo "Dispatching issue #$n"
            if ! bash scripts/agent-delivery/dispatch-cursor-agent.sh "$n"; then
              failed=1
              gh issue edit "$n" --add-label "agent-blocked" --remove-label "agent-running" || true
              gh issue comment "$n" --body "❌ Agent dispatch failed. See workflow run: $RUN_URL" || true
              if [ -n "$SLACK_WEBHOOK_URL" ]; then
                bash scripts/agent-delivery/notify-slack.sh "Agent dispatch FAILED for ${GITHUB_REPOSITORY}#$n" || true
              fi
            fi
          done
          exit "$failed"
