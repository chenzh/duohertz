# Engineering dispatch runs on the designated host with a Codex login.
# Keep this manual entry explicit while retiring the former cloud integration.
name: Agent delivery dispatch (local Codex)

on:
  workflow_dispatch:

permissions: {}

jobs:
  local-codex-required:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Show the configured execution path
        shell: bash
        run: |
          echo "::error::Engineering dispatch has moved to Codex CLI on the designated execution host."
          echo "On that host, verify: codex login status"
          echo "Inspect routing: python3 scripts/agent-delivery/dispatch_codex.py <issue> --dry-run"
          echo "For an authorized task: bash scripts/agent-delivery/dispatch-codex-cli.sh <issue> --local-only"
          echo "No issue was claimed and no implementation was started by this workflow."
          exit 1
