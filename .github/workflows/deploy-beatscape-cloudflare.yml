name: Deploy BeatScape (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "apps/beatscape/**"
      - "scripts/beatscape-catalog-status.py"
      - "scripts/deploy-beatscape-cf-pages.sh"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/deploy-beatscape-cloudflare.yml"
  pull_request:
    paths:
      - "apps/beatscape/**"
      - "scripts/beatscape-catalog-status.py"
      - "scripts/deploy-beatscape-cf-pages.sh"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/deploy-beatscape-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: beatscape-cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --filter @musicsaas/beatscape

      - name: Install browser
        run: pnpm --filter @musicsaas/beatscape exec playwright install --with-deps chromium

      - name: Verify release candidate
        run: |
          pnpm release:beatscape

      - name: Preserve release identity and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beatscape-release-evidence
          path: |
            apps/beatscape/dist/release.json
            apps/beatscape/test-results/

      - name: Check launch sign-off
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: pnpm --filter @musicsaas/beatscape launch:check

      - name: Publish to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/beatscape
          command: pages deploy dist --project-name=beatscape --branch=main --commit-dirty=true
