name: Deploy NeonBeat

on:
  push:
    branches: [main]
    paths:
      - "apps/neonbeat/**"
      - ".github/workflows/deploy-neonbeat.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: neonbeat-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/neonbeat/package-lock.json
      - name: Install & build
        working-directory: apps/neonbeat
        env:
          VITE_BASE: /neonbeat/
        run: |
          npm ci
          npm test
          npm run build
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/neonbeat
          cp -r apps/neonbeat/dist/* _site/neonbeat/
          touch _site/.nojekyll
          printf '%s\n' '<!DOCTYPE html>' '<meta http-equiv="refresh" content="0;url=neonbeat/">' '<title>NeonBeat</title>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
