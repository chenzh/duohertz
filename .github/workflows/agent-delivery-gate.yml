name: Agent delivery gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to evaluate
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: agent-delivery-gate-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      # Evaluate trusted policy/scripts; never execute a PR's version with a write token.
      - name: Checkout base policy
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check merge eligibility
        id: gate
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid PR number"; exit 1; }
          OUT="$(bash scripts/agent-delivery/check-merge-eligible.sh "$PR_NUMBER")"
          echo "$OUT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$OUT" =~ ^merge_eligible=true\ sha=([0-9a-f]{40})\ files=[0-9]+$ ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "sha=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report opt-in status
        if: vars.AGENT_DELIVERY_AUTO_MERGE != 'true'
        run: echo 'Auto-merge is inactive. Enable AGENT_DELIVERY_AUTO_MERGE only after reviewing repository protection and this workflow.' >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for CI on the evaluated commit
        if: steps.gate.outputs.eligible == 'true' && vars.AGENT_DELIVERY_AUTO_MERGE == 'true'
        timeout-minutes: 15
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          while true; do
            pr="$(gh pr view "$PR_NUMBER" --json headRefOid,statusCheckRollup)"
            [[ "$(jq -r .headRefOid <<< "$pr")" == "$EXPECTED_SHA" ]] || { echo '::error::PR head changed; reevaluate the new commit'; exit 1; }
            checks="$(jq '[.statusCheckRollup[] | select(.name == "unit" or .name == "build" or .name == "beatscape" or .name == "integration")]' <<< "$pr")"
            if jq -e 'any(.[]; .status == "COMPLETED" and .conclusion != "SUCCESS")' <<< "$checks" >/dev/null; then
              echo '::error::A CI job did not succeed'
              exit 1
            fi
            if jq -e '([.[].name] | unique | sort) == ["beatscape", "build", "integration", "unit"] and all(.[]; .status == "COMPLETED" and .conclusion == "SUCCESS")' <<< "$checks" >/dev/null; then
              break
            fi
            sleep 30
          done

      - name: Recheck policy and enable auto-merge
        if: steps.gate.outputs.eligible == 'true' && vars.AGENT_DELIVERY_AUTO_MERGE == 'true'
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          OUT="$(bash scripts/agent-delivery/check-merge-eligible.sh "$PR_NUMBER")"
          echo "$OUT" >> "$GITHUB_STEP_SUMMARY"
          [[ "$OUT" == "merge_eligible=true sha=$EXPECTED_SHA "* ]] || { echo '::error::PR eligibility changed'; exit 1; }
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch --match-head-commit "$EXPECTED_SHA"
