name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install
      - run: pip install -r tests/requirements.txt
      - run: bash scripts/harness.sh unit
        env:
          MOCK_WORKERS: "true"
          API_KEY: test-key

  build:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: bash scripts/harness.sh build

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install
      - run: pip install -r tests/requirements.txt
      - run: bash scripts/harness.sh integration
        env:
          MOCK_WORKERS: "true"
          API_KEY: test-key
          API_KEY_ALT: dev-api-key-alt
          INTEGRATION: "false"
          RATE_LIMIT_QPS: "100"
          RATE_LIMIT_DAILY_JOBS: "10000"
