name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter gateway db:push
        env:
          DATABASE_URL: file:./data/test.db
          MOCK_WORKERS: "true"
          API_KEY: test-key
      - run: pnpm test
        env:
          DATABASE_URL: file:./data/test.db
          MOCK_WORKERS: "true"
          API_KEY: test-key
