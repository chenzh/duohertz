name: "Agent-safe task"
description: Bounded MusicSaas task with explicit scope and verifiable acceptance criteria.
title: "[Agent]: "
labels: ["agent-safe"]
body:
  - type: markdown
    attributes:
      value: |
        Tasks with label `agent-safe` may be picked up by the agent delivery workflow.
        Before using this template, confirm the task fits the queue scope: at most 3 modules,
        with no migration, auth/payment/permission-model change, or breaking API change.
        See `.delivery/README.md`, `.delivery/beatscape/brief.md`, and `.agents/skills/music-verify/SKILL.md`.

  - type: textarea
    id: summary
    attributes:
      label: What & why (max 3 sentences)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (checkbox list)
      description: State observable results and choose actual commands from music-verify. Examples below cover BeatScape code; adapt them to the task.
      placeholder: |
        - [ ] Describe the trigger and expected behavior, including a relevant edge case.
        - [ ] pnpm --filter @musicsaas/beatscape test exits 0
        - [ ] pnpm build:beatscape exits 0 (includes typecheck)
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope (required)
      placeholder: |
        - Changes limited to the listed apps/beatscape paths
        - No judgment-window changes (15/30/50 ms)
        - No migrations
        - No auth/payment changes
    validations:
      required: true

  - type: input
    id: delivery_slug
    attributes:
      label: Delivery slug (optional)
      description: Folder under `.delivery/<slug>/` if not using issue-only input.
      placeholder: beatscape
