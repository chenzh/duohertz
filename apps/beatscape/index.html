<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#12100F" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312100F'/%3E%3Cpolygon points='16,4 28,16 16,28 4,16' fill='none' stroke='%23E23D3D' stroke-width='2.5'/%3E%3Cpolygon points='16,11 21,16 16,21 11,16' fill='%23F2E4C9'/%3E%3C/svg%3E"
    />
    <title>BeatScape — Feel the Beat, Own the Scape</title>
    <meta
      name="description"
      content="English pop &amp; EDM browser rhythm game with AI originals. No account, no ads. Scores stay in your browser. Feel the Beat, Own the Scape."
    />
    <link rel="canonical" href="https://beatscape.pages.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BeatScape" />
    <meta property="og:title" content="BeatScape — Feel the Beat, Own the Scape" />
    <meta property="og:description" content="Play AI original beats in your browser. No account, no ads. Scores stay on your device." />
    <meta property="og:url" content="https://beatscape.pages.dev/" />
    <meta property="og:image" content="https://beatscape.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BeatScape — Feel the Beat. Own the Scape. Four lanes of AI original music." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BeatScape — Feel the Beat, Own the Scape" />

    <meta name="twitter:image" content="https://beatscape.pages.dev/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Anton (display), Sora (secondary), IBM Plex Sans (body) — all SIL OFL.
         Sora 只用到 600/700/800（见 styles.css），500 是白下载的 face，已去掉。
         字体 CSS 改为非阻塞加载：preload 成 stylesheet，onload 再切换 rel，
         避免首屏渲染被跨域字体 CSS 卡住；无 JS 时走 noscript 兜底。 -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sora:wght@600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sora:wght@600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
